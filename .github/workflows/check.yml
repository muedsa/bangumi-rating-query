name: 验证后端
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bangumi_test
          POSTGRES_PASSWORD: integration-test-password
          POSTGRES_DB: bangumi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bangumi_test -d bangumi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://bangumi_test:integration-test-password@127.0.0.1:5432/bangumi_test
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check
