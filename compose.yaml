services:
  api:
    build: .
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      DATABASE_DRIVER: ${DATABASE_DRIVER:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      STATS_ENABLED: ${STATS_ENABLED:-false}
      ALIAS_MISS_STATS_ENABLED: ${ALIAS_MISS_STATS_ENABLED:-false}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-20}
      RATING_TTL_HOURS: ${RATING_TTL_HOURS:-24}
      BANGUMI_USER_AGENT: ${BANGUMI_USER_AGENT:-}
      BANGUMI_ACCESS_TOKEN: ${BANGUMI_ACCESS_TOKEN:-}
      CALENDAR_SYNC_ENABLED: ${CALENDAR_SYNC_ENABLED:-false}
      CALENDAR_SYNC_HOUR_UTC: ${CALENDAR_SYNC_HOUR_UTC:-20}
      CALENDAR_PLATFORM_BATCH_SIZE: ${CALENDAR_PLATFORM_BATCH_SIZE:-10}
      TRENDS_SYNC_ENABLED: ${TRENDS_SYNC_ENABLED:-false}
      TRENDS_SYNC_HOUR_UTC: ${TRENDS_SYNC_HOUR_UTC:-21}
      TRENDS_SYNC_LIMIT: ${TRENDS_SYNC_LIMIT:-24}
      TRENDS_FETCH_MODE: ${TRENDS_FETCH_MODE:-browser}
      TRENDS_BROWSER_TIMEOUT_MS: ${TRENDS_BROWSER_TIMEOUT_MS:-45000}
      # 镜像内固定使用 Debian Chromium，不能被宿主机 .env 的本地浏览器路径覆盖。
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_USER_DATA_DIR: /app/data/browser-profile
    volumes:
      - bangumi-data:/app/data
    restart: unless-stopped
volumes:
  bangumi-data:
